<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px sans-serif;max-width:640px;margin:24px auto}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;padding:6px;font:inherit}button{margin-top:16px;padding:8px 14px;font:inherit}</style></head><body><h1>Experience</h1><form action="/submit" method="post">
<label for="fn">First name *</label><input id="fn" required>
<div id="list"><div class="exp"><label>Company</label><input name="company"><label>Job title</label><input name="title"></div></div>
<button type="button" id="add" onclick="const d=document.querySelector('.exp').cloneNode(true);d.querySelectorAll('input').forEach(i=>i.value='');list.appendChild(d)">+ Add another experience</button>
<br><button id="submit" type="submit">Submit application</button></form>
<script>window.__expect={two:()=>document.querySelectorAll('.exp').length===2,companies:()=>[...document.querySelectorAll('[name=company]')].map(i=>i.value).join('|')==='Northwind Labs|Contoso Analytics'}</script><script>window.__check=()=>{const missing=[];for(const [n,ok] of Object.entries(window.__expect||{})){if(!ok())missing.push(n)}return{ok:!missing.length,missing}}</script></body></html>
