<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px sans-serif;max-width:640px;margin:24px auto}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;padding:6px;font:inherit}button{margin-top:16px;padding:8px 14px;font:inherit}</style></head><body><h1>Bewerbung</h1><form action="/submit" method="post">
<label for="vn">Vorname *</label><input id="vn" required>
<label for="nn">Nachname *</label><input id="nn" required>
<label for="em">E-Mail *</label><input id="em" type="email" required>
<label for="tel">Telefon</label><input id="tel">
<button type="button" id="go" onclick="this.textContent='Gesendet'">Absenden</button></form>
<script>window.__expect={names:()=>vn.value==='Aarav'&&nn.value==='Mehta',email:()=>em.value.includes('@'),not_clicked:()=>go.textContent==='Absenden'}</script><script>window.__check=()=>{const missing=[];for(const [n,ok] of Object.entries(window.__expect||{})){if(!ok())missing.push(n)}return{ok:!missing.length,missing}}</script></body></html>
