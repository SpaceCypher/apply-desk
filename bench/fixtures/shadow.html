<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px sans-serif;max-width:640px;margin:24px auto}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;padding:6px;font:inherit}button{margin-top:16px;padding:8px 14px;font:inherit}</style></head><body><h1>Apply</h1><apply-form></apply-form>
<script>customElements.define('apply-form',class extends HTMLElement{connectedCallback(){const r=this.attachShadow({mode:'open'});r.innerHTML='<form action="/submit" method="post"><label for="fn">First name *</label><input id="fn" required><label for="em">Email *</label><input id="em" type="email" required><label for="li">LinkedIn profile</label><input id="li"><button type="submit">Submit application</button></form>'}})
const root=()=>document.querySelector('apply-form').shadowRoot
window.__expect={first:()=>root().getElementById('fn').value==='Aarav',email:()=>root().getElementById('em').value.includes('@'),linkedin:()=>root().getElementById('li').value.includes('linkedin')}</script><script>window.__check=()=>{const missing=[];for(const [n,ok] of Object.entries(window.__expect||{})){if(!ok())missing.push(n)}return{ok:!missing.length,missing}}</script></body></html>
