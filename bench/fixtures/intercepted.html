<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px sans-serif;max-width:640px;margin:24px auto}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px}button{margin-top:16px;padding:8px 14px}</style></head><body>
<h1>Apply</h1><form action="/submit" method="post" onsubmit="return false">
<label for="fn">First name *</label><input id="fn" required>
<label for="em">Email *</label><input id="em" type="email" required>
<button type="button" id="nx" onclick="p2.hidden=false;nx.hidden=true">Next</button>
<div id="p2" hidden><label for="ph">Phone *</label><input id="ph" required><button type="submit">Submit application</button></div></form>
<!-- An invisible promo layer that intercepts clicks over the form until Escape is pressed. No dialog role. -->
<div id="veil" style="position:fixed;inset:0;background:transparent;z-index:10"></div>
<script>addEventListener('keydown',e=>{if(e.key==='Escape')veil.remove()})
window.__expect={phone:()=>ph.value.length>5}
window.__check=()=>{const missing=[];for(const [n,ok] of Object.entries(window.__expect)){if(!ok())missing.push(n)}return{ok:!missing.length,missing}}</script></body></html>
