<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px sans-serif;max-width:640px;margin:24px auto}label{display:block;margin:12px 0 4px}input,select,textarea{width:100%;padding:6px;font:inherit}button{margin-top:16px;padding:8px 14px;font:inherit}</style></head><body><h1>Apply</h1><form action="/submit" method="post">
<label for="fn">First name *</label><input id="fn" required>
<p>Resume/CV *</p><div id="zone" role="button" tabindex="0" aria-label="Attach resume" style="border:2px dashed #888;padding:24px;text-align:center">Drop your resume here or click to attach</div>
<input id="file" type="file" hidden><p id="name"></p>
<button id="submit" type="submit">Submit application</button></form>
<script>zone.onclick=()=>file.click();file.onchange=()=>{name.textContent=file.files[0]?.name||''}
window.__expect={file:()=>file.files.length===1}</script><script>window.__check=()=>{const missing=[];for(const [n,ok] of Object.entries(window.__expect||{})){if(!ok())missing.push(n)}return{ok:!missing.length,missing}}</script></body></html>
